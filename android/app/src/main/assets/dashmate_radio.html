<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DashMate Radio</title>
<script>(function(){var q=/[?&]theme=(dark|light)/.exec(location.search),m=q&&q[1];
try{if(!m&&window.DashMate&&DashMate.theme)m=DashMate.theme();}catch(e){}
if(!m)m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=m;
window.ddTheme=function(t){document.documentElement.dataset.theme=(t==='dark'?'dark':'light');};})();</script>
<style>
  /* Same scale + palette as drivedeck_prayer.html */
  /* Bigger than the other pages: these are tap targets used while driving. */
  html { font-size: clamp(11px, min(2.7vh, 1.75vw), 28px); }
  :root {
    --bg: #F8FAFC; --surface: #FFFFFF; --surface-2: #F1F5F9; --border: #E2E8F0;
    --ink: #0F172A; --ink-2: #475569; --ink-3: #64748B;
    --accent: #0F766E; --on-accent: #FFFFFF; --danger: #DC2626; --ok: #15803D;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.06);
    --warn: #B45309;
    --accent-soft: color-mix(in srgb, var(--accent) 8%, var(--surface));
    --violet: var(--accent); --dim: var(--ink-2); --faint: var(--border);
    --sans: "Google Sans", Roboto, system-ui, sans-serif;
  }
  :root[data-theme="dark"] {
    --bg: #0F1115; --surface: #181B21; --surface-2: #20242B; --border: #2A2F37;
    --ink: #F1F5F9; --ink-2: #A3ACB9; --ink-3: #7C8594;
    --accent: #2DD4BF; --on-accent: #042F2E; --danger: #F87171; --ok: #4ADE80;
    --shadow: none;
    --warn: #FBBF24;
    --accent-soft: color-mix(in srgb, var(--accent) 10%, var(--surface));
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--sans);
    background: var(--bg); -webkit-font-smoothing: antialiased; }

  #app { height: 100%; display: grid; grid-template-columns: minmax(0, .74fr) minmax(0, 1.26fr); gap: 2.2rem; align-items: center;
         padding: calc(3.8rem + var(--dd-extra, 0px)) 2rem 2rem; }

  /* ---------- Now playing ---------- */
  #label { font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  #name { font-size: 3rem; line-height: 1.05; font-weight: 700; letter-spacing: -.02em; margin-top: .4rem; color: var(--ink);
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sub { font-size: 1.1rem; color: var(--ink-2); margin-top: .4rem; font-weight: 500; }
  #np { font-size: 1.25rem; margin-top: 1.4rem; min-height: 2.1rem; font-weight: 600; color: var(--ink);
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { display: inline-flex; align-items: center; gap: .55rem; margin-top: 1rem; font-size: 1.05rem;
            color: var(--ink-2); font-weight: 600; }
  #dot { width: .8rem; height: .8rem; border-radius: 50%; background: var(--ink-3); }
  body.playing #dot { background: var(--accent); animation: pulse 1.6s infinite; }
  body.playing #status { color: var(--accent); }
  body.buffering #dot { background: var(--warn); }
  body.error #dot { background: var(--danger); }
  body.error #status { color: var(--danger); }
  @keyframes pulse { 50% { opacity: .35; } }

  #controls { display: flex; align-items: center; gap: .8rem; margin-top: 2rem; }
  .ctl { width: 4.2rem; height: 4.2rem; flex: none; border-radius: 50%; border: 1px solid var(--border);
         background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; transition: transform .15s ease; }
  .ctl svg { width: 1.9rem; height: 1.9rem; fill: var(--ink); }
  .ctl.big { width: 5.4rem; height: 5.4rem; background: var(--accent); border: 0; }
  .ctl.big svg { width: 3rem; height: 3rem; fill: var(--on-accent); }
  .ctl:active { transform: scale(.94); }

  /* ---------- Station grid ---------- */
  #grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; max-height: 100%; overflow-y: auto;
          padding: .2rem .2rem .6rem; scrollbar-width: none; }
  #grid::-webkit-scrollbar { display: none; }
  .st { position: relative; overflow: hidden; min-height: 5rem; border-radius: .9rem; padding: .7rem .8rem .7rem 1.05rem; min-width: 0; text-align: left;
        background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow); color: var(--ink); font-family: inherit;
        display: flex; flex-direction: column; justify-content: center; gap: .25rem; transition: transform .15s ease; }
  .st::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: .3rem; background: var(--accent); opacity: 0; transition: opacity .2s ease; }
  .st b { font-size: 1.2rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st small { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); font-weight: 500; }
  /* Playing station: accent left bar, accent name, faint accent tint. */
  .st.on { border-color: var(--accent); background: var(--accent-soft); }
  .st.on::before { opacity: 1; }
  .st.on b { color: var(--accent); }
  .st:active { transform: scale(.97); }

  /* Split view (card beside the Deck) / narrower screens: now-playing bar on top, stations below */
  @media (max-aspect-ratio: 3/2) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 1.4rem; align-items: start; }
    #app { padding-top: calc(5.2rem + var(--dd-extra, 0px)); }
    #label { display: none; } /* the dock bar sits here and already shows Radio is active */
    #hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto auto;
            column-gap: 1.2rem; align-items: center; }
    #hero > :not(#controls) { grid-column: 1; }
    #controls { grid-column: 2; grid-row: 1 / span 4; margin-top: 0; }
    #name { font-size: 2.6rem; }
    #np { margin-top: .5rem; min-height: 0; }
    #status { margin-top: .4rem; }
  }
  /* Portrait head units: 2 station columns */
  @media (max-aspect-ratio: 1/1) {
    #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
  /* Tall head units (Jaecoo J7 portrait): the base size followed the narrow width, so everything was tiny.
     Size from width and height, clamped for big screens; centred now-playing card, controls below it,
     and the station tiles stretch to fill the rest of the screen (scrolling only if they can't fit). */
  @media (max-aspect-ratio: 4/5) {
    html { font-size: clamp(14px, min(3.3vw, 1.85vh), 34px); }
    #app { gap: 1.1rem; align-items: stretch; padding: calc(max(84px, 3.4rem) + var(--dd-extra, 0px)) 1.4rem 1.4rem; }
    #hero { display: flex; flex-direction: column; align-items: center; text-align: center; }
    #name { font-size: 2.6rem; max-width: 100%; }
    #sub { font-size: 1.1rem; }
    #np { font-size: 1.2rem; margin-top: .6rem; max-width: 100%; }
    #status { margin-top: .5rem; font-size: 1.05rem; }
    #controls { margin-top: 1rem; gap: 1.6rem; justify-content: center; }
    .ctl { width: max(64px, 4.2rem); height: max(64px, 4.2rem); }
    .ctl.big { width: max(80px, 5.4rem); height: max(80px, 5.4rem); }
    #grid { align-self: stretch; height: 100%; max-height: none; grid-auto-rows: minmax(auto, 1fr); gap: .6rem; }
    .st { min-height: 64px; padding: .4rem .9rem .4rem 1.2rem; gap: .15rem; }
    .st b { font-size: 1.25rem; }
    .st small { font-size: .9rem; }
  }
  /* Wider tall screens (e.g. 1200x1600): 3 columns so every station fits without scrolling. */
  @media (max-aspect-ratio: 4/5) and (min-aspect-ratio: 7/10) {
    #grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
</style>
<script src="dd_tall.js"></script>
</head>
<body>
<div id="app">
  <section id="hero">
    <div id="label">DashMate Radio</div>
    <div id="name">Pick a station</div>
    <div id="sub">Malaysian radio, played through your car speakers</div>
    <div id="np"></div>
    <div id="status"><span id="dot"></span><span id="statusText">Off</span></div>
    <div id="controls">
      <button class="ctl" id="prev" aria-label="Previous station">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="ctl big" id="toggle" aria-label="Play or pause">
        <svg viewBox="0 0 24 24" id="toggleIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctl" id="next" aria-label="Next station">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="ctl" id="stop" aria-label="Stop radio">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
    </div>
  </section>
  <section id="grid"></section>
</div>

<script>
(function () {
  var R = window.DashMateRadio;
  var $ = function (id) { return document.getElementById(id); };
  var PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  var STATUS = { IDLE: 'Off', BUFFERING: 'Tuning…', PLAYING: 'Live', PAUSED: 'Paused',
                 RECONNECTING: 'Reconnecting…', ERROR: 'Station unavailable' };
  var current = '';

  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function buildGrid() {
    var list = [];
    try { list = JSON.parse(R ? R.stations() : '[]'); } catch (e) {}
    $('grid').innerHTML = list.map(function (s) {
      return '<button class="st" data-id="' + esc(s.id) + '"><b>' + esc(s.name) + '</b><small>' +
        esc(s.network + (s.band ? ' · ' + s.band : '')) + '</small></button>';
    }).join('');
  }

  // The 1 s poll only writes to the DOM when a value actually changes.
  function put(el, prop, v) {
    var k = '__dd_' + prop;
    if (el[k] === v) return;
    el[k] = v; el[prop] = v;
  }

  function render() {
    var st = {};
    try { st = JSON.parse(R ? R.state() : '{}'); } catch (e) {}
    var on = !!st.on, status = on ? (st.status || 'IDLE') : 'IDLE';
    put(document.body, 'className', status === 'PLAYING' ? 'playing'
      : (status === 'BUFFERING' || status === 'RECONNECTING') ? 'buffering'
      : status === 'ERROR' ? 'error' : '');
    if (st.name) { put($('name'), 'textContent', st.name); put($('sub'), 'textContent', st.subtitle || ''); }
    put($('np'), 'textContent', on ? (status === 'ERROR' ? '' : (st.nowPlaying || '')) : '');
    put($('statusText'), 'textContent', status === 'ERROR' && st.error ? st.error : STATUS[status] || status);
    var playing = on && (status === 'PLAYING' || status === 'BUFFERING' || status === 'RECONNECTING');
    put($('toggleIcon'), 'innerHTML', playing ? PAUSE : PLAY);
    var id = on ? st.id : '';
    if (id !== current) {
      current = id;
      Array.prototype.forEach.call(document.querySelectorAll('.st'), function (b) {
        b.classList.toggle('on', b.getAttribute('data-id') === id);
      });
    }
  }

  document.addEventListener('click', function (ev) {
    if (!R) return;
    var b = ev.target.closest('.st');
    if (b) { R.play(b.getAttribute('data-id')); setTimeout(render, 150); return; }
    var c = ev.target.closest('.ctl');
    if (!c) return;
    if (c.id === 'toggle') R.toggle();
    else if (c.id === 'next') R.next();
    else if (c.id === 'prev') R.prev();
    else if (c.id === 'stop') R.stop();
    setTimeout(render, 150);
  });

  if (!R) { $('sub').textContent = 'Radio is only available on the car screen'; return; }
  buildGrid();
  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
