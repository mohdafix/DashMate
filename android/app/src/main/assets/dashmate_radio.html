<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DashMate Radio</title>
<style>
  /* Same scale + palette as drivedeck_prayer.html */
  /* Bigger than the other pages: these are tap targets used while driving. */
  html { font-size: clamp(11px, min(2.7vh, 1.75vw), 28px); }
  :root {
    --accent: #14E0C1; --accent-soft: rgba(20,224,193,.16); --violet: #0B9E8A;
    --ink: #FFFFFF; --dim: rgba(255,255,255,.7); --faint: rgba(255,255,255,.16);
    --danger: #FF6B6B;
    --sans: "Google Sans", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--sans);
    background: radial-gradient(circle at 30% 20%, #16213D, #0B0F1A 70%); -webkit-font-smoothing: antialiased; }

  #app { height: 100%; display: grid; grid-template-columns: minmax(0, .74fr) minmax(0, 1.26fr); gap: 2.2rem; align-items: center;
         padding: calc(3.8rem + var(--dd-extra, 0px)) 2rem 2rem; }

  /* ---------- Now playing ---------- */
  #label { font-size: 1rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  #name { font-size: 3rem; line-height: 1.05; font-weight: 700; letter-spacing: -.02em; margin-top: .4rem;
          text-shadow: 0 2px 16px rgba(0,0,0,.6); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #sub { font-size: 1.1rem; color: var(--dim); margin-top: .4rem; font-weight: 500; }
  #np { font-size: 1.25rem; margin-top: 1.4rem; min-height: 2.1rem; font-weight: 600;
        overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status { display: inline-flex; align-items: center; gap: .55rem; margin-top: 1rem; font-size: 1.05rem;
            color: var(--dim); font-weight: 600; }
  #dot { width: .8rem; height: .8rem; border-radius: 50%; background: var(--faint); }
  body.playing #dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); animation: pulse 1.6s infinite; }
  body.buffering #dot { background: #F5C451; }
  body.error #dot { background: var(--danger); }
  body.error #status { color: var(--danger); }
  @keyframes pulse { 50% { opacity: .35; } }

  #controls { display: flex; align-items: center; gap: .8rem; margin-top: 2rem; }
  .ctl { width: 4.2rem; height: 4.2rem; flex: none; border-radius: 50%; border: 1px solid rgba(255,255,255,.18);
         background: rgba(255,255,255,.08); display: grid; place-items: center; }
  .ctl svg { width: 1.9rem; height: 1.9rem; fill: #fff; }
  .ctl.big { width: 5.4rem; height: 5.4rem; background: #fff; border: 0; }
  .ctl.big svg { width: 3rem; height: 3rem; fill: #0B0F1A; }
  .ctl:active { transform: scale(.94); }

  /* ---------- Station grid ---------- */
  #grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .8rem; max-height: 100%; overflow-y: auto;
          padding: .2rem; scrollbar-width: none; }
  #grid::-webkit-scrollbar { display: none; }
  .st { min-height: 5rem; border-radius: 1.1rem; padding: .7rem .8rem; min-width: 0; text-align: left;
        background: linear-gradient(145deg, rgba(22,28,44,.82), rgba(12,16,26,.9));
        border: 1px solid rgba(255,255,255,.14); color: var(--ink); font-family: inherit;
        display: flex; flex-direction: column; justify-content: center; gap: .25rem; }
  .st b { font-size: 1.2rem; font-weight: 700; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .st small { font-size: .85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); font-weight: 500; }
  .st.on { border-color: var(--accent); background: linear-gradient(145deg, rgba(20,224,193,.22), rgba(12,16,26,.9));
           box-shadow: 0 0 0 1px var(--accent) inset, 0 0 18px rgba(20,224,193,.25); }
  .st:active { transform: scale(.97); }

  /* Split view (card beside the Deck) / narrower screens: now-playing bar on top, stations below */
  @media (max-aspect-ratio: 3/2) {
    #app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 1.4rem; align-items: start; }
    #app { padding-top: calc(5.2rem + var(--dd-extra, 0px)); }
    #label { display: none; } /* the dock bar sits here and already shows Radio is active */
    #hero { display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto auto;
            column-gap: 1.2rem; align-items: center; }
    #hero > :not(#controls) { grid-column: 1; }
    #controls { grid-column: 2; grid-row: 1 / span 4; margin-top: 0; }
    #name { font-size: 2.6rem; }
    #np { margin-top: .5rem; min-height: 0; }
    #status { margin-top: .4rem; }
  }
  /* Portrait head units: 2 station columns */
  @media (max-aspect-ratio: 1/1) {
    #grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>
</head>
<body>
<div id="app">
  <section id="hero">
    <div id="label">DashMate Radio</div>
    <div id="name">Pick a station</div>
    <div id="sub">Malaysian radio, played through your car speakers</div>
    <div id="np"></div>
    <div id="status"><span id="dot"></span><span id="statusText">Off</span></div>
    <div id="controls">
      <button class="ctl" id="prev" aria-label="Previous station">
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button>
      <button class="ctl big" id="toggle" aria-label="Play or pause">
        <svg viewBox="0 0 24 24" id="toggleIcon"><path d="M8 5v14l11-7z"/></svg></button>
      <button class="ctl" id="next" aria-label="Next station">
        <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
      <button class="ctl" id="stop" aria-label="Stop radio">
        <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
    </div>
  </section>
  <section id="grid"></section>
</div>

<script>
(function () {
  var R = window.DashMateRadio;
  var $ = function (id) { return document.getElementById(id); };
  var PLAY = '<path d="M8 5v14l11-7z"/>', PAUSE = '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>';
  var STATUS = { IDLE: 'Off', BUFFERING: 'Tuning…', PLAYING: 'Live', PAUSED: 'Paused',
                 RECONNECTING: 'Reconnecting…', ERROR: 'Station unavailable' };
  var current = '';

  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function buildGrid() {
    var list = [];
    try { list = JSON.parse(R ? R.stations() : '[]'); } catch (e) {}
    $('grid').innerHTML = list.map(function (s) {
      return '<button class="st" data-id="' + esc(s.id) + '"><b>' + esc(s.name) + '</b><small>' +
        esc(s.network + (s.band ? ' · ' + s.band : '')) + '</small></button>';
    }).join('');
  }

  function render() {
    var st = {};
    try { st = JSON.parse(R ? R.state() : '{}'); } catch (e) {}
    var on = !!st.on, status = on ? (st.status || 'IDLE') : 'IDLE';
    document.body.className = status === 'PLAYING' ? 'playing'
      : (status === 'BUFFERING' || status === 'RECONNECTING') ? 'buffering'
      : status === 'ERROR' ? 'error' : '';
    if (st.name) { $('name').textContent = st.name; $('sub').textContent = st.subtitle || ''; }
    $('np').textContent = on ? (status === 'ERROR' ? '' : (st.nowPlaying || '')) : '';
    $('statusText').textContent = status === 'ERROR' && st.error ? st.error : STATUS[status] || status;
    var playing = on && (status === 'PLAYING' || status === 'BUFFERING' || status === 'RECONNECTING');
    $('toggleIcon').innerHTML = playing ? PAUSE : PLAY;
    var id = on ? st.id : '';
    if (id !== current) {
      current = id;
      Array.prototype.forEach.call(document.querySelectorAll('.st'), function (b) {
        b.classList.toggle('on', b.getAttribute('data-id') === id);
      });
    }
  }

  document.addEventListener('click', function (ev) {
    if (!R) return;
    var b = ev.target.closest('.st');
    if (b) { R.play(b.getAttribute('data-id')); setTimeout(render, 150); return; }
    var c = ev.target.closest('.ctl');
    if (!c) return;
    if (c.id === 'toggle') R.toggle();
    else if (c.id === 'next') R.next();
    else if (c.id === 'prev') R.prev();
    else if (c.id === 'stop') R.stop();
    setTimeout(render, 150);
  });

  if (!R) { $('sub').textContent = 'Radio is only available on the car screen'; return; }
  buildGrid();
  render();
  setInterval(render, 1000);
})();
</script>
</body>
</html>
