<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>DashMate Deck</title>
  <script>(function(){var q=/[?&]theme=(dark|light)/.exec(location.search),m=q&&q[1];
try{if(!m&&window.AutoDeck&&AutoDeck.theme)m=AutoDeck.theme();}catch(e){}
if(!m)m=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
document.documentElement.dataset.theme=m;
window.ddTheme=function(t){document.documentElement.dataset.theme=(t==='dark'?'dark':'light');};})();</script>
  <style>
    :root {
      --bg: #F8FAFC; --surface: #FFFFFF; --surface-2: #F1F5F9; --border: #E2E8F0;
      --ink: #0F172A; --ink-2: #475569; --ink-3: #64748B;
      --accent: #0F766E; --on-accent: #FFFFFF; --danger: #DC2626; --ok: #15803D;
      --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 12px rgba(15,23,42,.06);
      /* Old names, kept as aliases so inline styles keep working. */
      --card-bg: var(--surface);
      --card-border: var(--border);
      --text-main: var(--ink);
      --text-sub: var(--ink-2);
      --card-radius: 16px;
    }
    :root[data-theme="dark"] {
      --bg: #0F1115; --surface: #181B21; --surface-2: #20242B; --border: #2A2F37;
      --ink: #F1F5F9; --ink-2: #A3ACB9; --ink-3: #7C8594;
      --accent: #2DD4BF; --on-accent: #042F2E; --danger: #F87171; --ok: #4ADE80;
      --shadow: none;
    }

    /* Accent variants picked by the app (body data-theme); day and night shades. */
    [data-theme="cyber_red"] {
      --accent: #BE123C;
      --on-accent: #FFFFFF;
    }
    [data-theme="carbon_dark"] {
      --accent: #B45309;
      --on-accent: #FFFFFF;
    }
    :root[data-theme="dark"] [data-theme="cyber_red"] { --accent: #FB7185; --on-accent: #1F0A0A; }
    :root[data-theme="dark"] [data-theme="carbon_dark"] { --accent: #FBBF24; --on-accent: #1F1300; }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html { background: var(--bg); }

    body {
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      color: var(--ink);
      font-family: "Google Sans", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 14px 18px;
    }

    /* Top Bar */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.2rem;
      letter-spacing: 1.5px;
      color: var(--accent);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-badges {
      display: flex;
      gap: 12px;
    }

    .badge {
      background: var(--surface-2);
      border: 1px solid var(--border);
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--ink-2);
    }
    .badge.active {
      color: var(--accent);
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 8%, var(--surface));
    }

    /* Main Dashboard Grid */
    .dashboard-grid {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 14px;
      min-height: 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: transform 0.15s ease;
    }

    .card:active {
      transform: scale(0.985);
      border-color: var(--accent);
    }

    /* Widget Spans */
    .speed-card { grid-column: span 3; grid-row: span 2; }
    .clock-card { grid-column: span 3; grid-row: span 1; }
    .weather-card { grid-column: span 3; grid-row: span 1; }
    .shortcuts-card { grid-column: span 3; grid-row: span 1; }
    .media-card { grid-column: span 5; grid-row: span 1; }
    .youtube-card { grid-column: span 4; grid-row: span 1; }

    /* Speedometer */
    .speed-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      position: relative;
    }

    .speed-val {
      font-size: 4.8rem;
      font-weight: 900;
      line-height: 1;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }

    .speed-unit {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 4px;
    }

    .speed-bar-bg {
      width: 80%;
      height: 6px;
      background: var(--surface-2);
      border-radius: 4px;
      margin-top: 18px;
      overflow: hidden;
    }

    /* Filled with transform (compositor only); the update sets scaleX. */
    .speed-bar-fill {
      height: 100%;
      width: 100%;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform 0.25s ease;
    }

    /* Clock Card */
    .clock-time {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: var(--ink);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .clock-date {
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--ink-2);
      margin-top: 6px;
    }

    /* Weather Card */
    .weather-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .weather-temp {
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--ink);
    }
    .weather-desc {
      font-size: 0.9rem;
      color: var(--ink-2);
      margin-top: 2px;
    }
    .weather-icon {
      font-size: 2.2rem;
    }

    /* Media Player Card */
    .media-body {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .media-cover {
      width: 60px;
      height: 60px;
      border-radius: 12px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--surface-2)), var(--surface-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }
    .media-meta {
      flex: 1;
      min-width: 0;
    }
    .media-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-artist {
      font-size: 0.85rem;
      color: var(--ink-2);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .media-controls {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }
    .btn-ctrl {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--ink);
      border-radius: 50%;
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    #playBtn {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--on-accent);
    }
    .btn-ctrl:active {
      transform: scale(0.92);
      background: var(--accent);
      color: var(--on-accent);
    }

    /* YouTube Card */
    .yt-box {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .yt-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--danger);
    }
    .yt-preview {
      flex: 1;
      border-radius: 12px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 6px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }
    .yt-preview iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
    .yt-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 0.8rem;
      color: var(--ink-2);
    }

    /* Shortcuts Card */
    .shortcuts-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      height: 100%;
    }
    .btn-sc {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .btn-sc:active {
      transform: scale(0.96);
      background: var(--accent);
      color: var(--on-accent);
    }
  </style>
</head>
<body data-theme="teal_navy">

  <!-- Header -->
  <header>
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
        <polyline points="2 17 12 22 22 17"></polyline>
        <polyline points="2 12 12 17 22 12"></polyline>
      </svg>
      <span>DashMate</span>
    </div>
    <div class="status-badges">
      <div class="badge active" id="gpsBadge">GPS READY</div>
      <div class="badge" id="deckStatus">CONNECTED</div>
    </div>
  </header>

  <!-- Dashboard Grid -->
  <main class="dashboard-grid">

    <!-- Speedometer -->
    <div class="card speed-card">
      <div class="speed-container">
        <div class="speed-val" id="speedText">0</div>
        <div class="speed-unit" id="speedUnitText">KM/H</div>
        <div class="speed-bar-bg">
          <div class="speed-bar-fill" id="speedBar"></div>
        </div>
      </div>
    </div>

    <!-- Clock -->
    <div class="card clock-card">
      <div>
        <div class="clock-time" id="clockTime">--:--</div>
        <div class="clock-date" id="clockDate">Loading...</div>
      </div>
      <span style="font-size: 0.75rem; color: var(--accent); font-weight: 600; text-transform: uppercase;">Realtime Deck</span>
    </div>

    <!-- Weather -->
    <div class="card weather-card">
      <div class="weather-info">
        <div>
          <div class="weather-temp" id="weatherTemp">28°C</div>
          <div class="weather-desc" id="weatherCity">Kuala Lumpur</div>
        </div>
        <div class="weather-icon" id="weatherIcon">☀️</div>
      </div>
      <div style="font-size: 0.8rem; color: var(--text-sub);" id="weatherCondition">Sunny & Clear</div>
    </div>

    <!-- Quick Shortcuts -->
    <div class="card shortcuts-card">
      <div class="shortcuts-grid">
        <button class="btn-sc" onclick="sendNav('Home')">🏠 Home</button>
        <button class="btn-sc" onclick="sendNav('Work')">🏢 Work</button>
        <button class="btn-sc" onclick="sendNav('Gas Station')">⛽ Fuel</button>
        <button class="btn-sc" onclick="sendNav('Coffee')">☕ Coffee</button>
      </div>
    </div>

    <!-- Media Player -->
    <div class="card media-card">
      <div class="media-body">
        <div class="media-cover" id="mediaCover">🎵</div>
        <div class="media-meta">
          <div class="media-title" id="songTitle">Not Playing</div>
          <div class="media-artist" id="songArtist">DashMate Audio</div>
          <div class="media-controls">
            <button class="btn-ctrl" onclick="sendMedia('prev')">⏮</button>
            <button class="btn-ctrl" id="playBtn" onclick="sendMedia('toggle')">▶</button>
            <button class="btn-ctrl" onclick="sendMedia('next')">⏭</button>
          </div>
        </div>
      </div>
    </div>

    <!-- YouTube Player -->
    <div class="card youtube-card">
      <div class="yt-box">
        <div class="yt-header">
          <span>▶ YouTube Deck</span>
          <span style="font-size: 0.75rem; color: var(--text-sub);">Direct Stream</span>
        </div>
        <div class="yt-preview" id="ytContainer" onclick="loadDefaultVideo()">
          <div class="yt-placeholder" id="ytPlaceholder">
            <span style="font-size: 1.6rem; color: var(--danger);">▶</span>
            <span>Tap to load video</span>
          </div>
        </div>
      </div>
    </div>

  </main>

  <script>
    // Live Clock
    // Writes to the DOM only when the shown text changes (once a minute, not every second).
    let shownTime = '', shownDate = '';
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const time = `${hours}:${minutes}`;
      if (time !== shownTime) { shownTime = time; document.getElementById('clockTime').textContent = time; }

      const options = { weekday: 'short', month: 'short', day: 'numeric' };
      const date = now.toLocaleDateString('en-US', options);
      if (date !== shownDate) { shownDate = date; document.getElementById('clockDate').textContent = date; }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Global Bridge Interface
    function sendNav(place) {
      if (window.DashMateBridge && window.DashMateBridge.launchNavigation) {
        window.DashMateBridge.launchNavigation(place);
      } else {
        console.log("Nav to:", place);
      }
    }

    function sendMedia(action) {
      if (window.DashMateBridge && window.DashMateBridge.playMediaAction) {
        window.DashMateBridge.playMediaAction(action);
      }
      const playBtn = document.getElementById('playBtn');
      if (action === 'toggle') {
        playBtn.textContent = playBtn.textContent === '▶' ? '⏸' : '▶';
      }
    }

    function loadDefaultVideo() {
      const container = document.getElementById('ytContainer');
      // Embed royalty free automotive ambient / lofi or user video
      container.innerHTML = '<iframe src="https://www.youtube.com/embed/jfKfPfyJRdk?autoplay=1&mute=1" allow="autoplay; encrypted-media"></iframe>';
    }

    // Called from Native Kotlin
    window.dashMateUpdate = function(state) {
      if (!state) return;

      // Speed
      if (state.speed !== undefined) {
        document.getElementById('speedText').textContent = Math.round(state.speed);
        const percent = Math.min(100, (state.speed / 180) * 100);
        document.getElementById('speedBar').style.transform = 'scaleX(' + (percent / 100).toFixed(3) + ')';
      }
      if (state.speedUnit) {
        document.getElementById('speedUnitText').textContent = state.speedUnit;
      }

      // Weather
      if (state.weather) {
        if (state.weather.temp) document.getElementById('weatherTemp').textContent = state.weather.temp;
        if (state.weather.city) document.getElementById('weatherCity').textContent = state.weather.city;
        if (state.weather.condition) document.getElementById('weatherCondition').textContent = state.weather.condition;
      }

      // Music
      if (state.music) {
        if (state.music.title) document.getElementById('songTitle').textContent = state.music.title;
        if (state.music.artist) document.getElementById('songArtist').textContent = state.music.artist;
        if (state.music.isPlaying !== undefined) {
          document.getElementById('playBtn').textContent = state.music.isPlaying ? '⏸' : '▶';
        }
      }

      // Theme
      if (state.theme) {
        document.body.setAttribute('data-theme', state.theme);
      }

      // YouTube
      if (state.youtubeId && state.youtubeId.trim() !== "") {
        const container = document.getElementById('ytContainer');
        container.innerHTML = `<iframe src="https://www.youtube.com/embed/${state.youtubeId}?autoplay=1" allow="autoplay; encrypted-media"></iframe>`;
      }
    };
  </script>
</body>
</html>
